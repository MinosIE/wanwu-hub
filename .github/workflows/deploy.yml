name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # 门禁：类型 / 数据 / i18n 校验，失败则不构建、不发布
      - name: Verify (typecheck + 数据 + i18n)
        run: npm run verify
      # 预渲染需要 Chrome：puppeteer 安装脚本会下载，这里显式再装一次以防被跳过
      - name: Install Chrome for puppeteer
        run: npx puppeteer browsers install chrome
      - run: npm run build:ssg
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
