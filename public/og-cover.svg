<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img"
  aria-label="万物通识系列 · Hub of Everything">
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1424" />
      <stop offset="0.58" stop-color="#12284a" />
      <stop offset="1" stop-color="#0a1f38" />
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.2" r="0.62">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8" />
      <stop offset="1" stop-color="#3b82f6" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#hero)" />
  <rect width="1200" height="630" fill="url(#glow)" />

  <!-- 地球标记：一个入口，看尽万物 -->
  <g fill="none" stroke="url(#mark)" stroke-width="6" stroke-linecap="round" opacity="0.95">
    <circle cx="980" cy="300" r="150" />
    <ellipse cx="980" cy="300" rx="66" ry="150" />
    <line x1="830" y1="300" x2="1130" y2="300" />
    <path d="M850 216 Q980 264 1110 216" />
    <path d="M850 384 Q980 336 1110 384" />
  </g>

  <text x="80" y="230" fill="#FFFFFF" font-size="90" font-weight="800"
    font-family="PingFang SC, Microsoft YaHei, Helvetica, Arial, sans-serif">
    万物通识系列
  </text>
  <text x="82" y="300" fill="#38bdf8" font-size="42" font-weight="700" font-family="Helvetica, Arial, sans-serif">
    Hub of Everything
  </text>
  <text x="82" y="360" fill="#8ea4c4" font-size="28"
    font-family="PingFang SC, Microsoft YaHei, Helvetica, Arial, sans-serif">
    一个入口，看尽万物 —— 系列聚合导航站
  </text>

  <g fill="#cfe0f5" font-size="26" font-family="PingFang SC, Microsoft YaHei, Helvetica, Arial, sans-serif">
    <text x="82" y="470">中华历史 · 心理学 · 经济学 · 哲学 · 地球科学</text>
    <text x="82" y="512">生命科学 · 物理学 · 化学</text>
  </g>
</svg>