<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>万物通识系列 — 系列入口</title>
    <meta
      name="description"
      content="万物通识系列统一入口：一个入口看尽中华历史与六大学科（心理·哲学·地理·生物·物理·化学）的系列项目导航。"
    />
    <meta property="og:title" content="万物通识系列" />
    <meta
      property="og:description"
      content="一个入口，看尽万物 —— 系列聚合导航站"
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:image"
      content="https://minosie.github.io/wanwu-hub/og-cover.svg"
    />
    <meta property="og:image:alt" content="万物通识系列 · Hub of Everything" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // 防闪：在样式应用前同步主题与语言
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (!t)
            t = matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          document.documentElement.setAttribute("data-theme", t);
          // 与学科侧 detectLang() 保持同一优先级：?lang= > localStorage > navigator
          // 只读不写 localStorage：直链不该把访客的长期偏好覆写掉
          var l = new URLSearchParams(location.search).get("lang");
          if (!l) l = localStorage.getItem("lang");
          if (!l)
            l = (navigator.language || "zh").toLowerCase().startsWith("en")
              ? "en"
              : "zh";
          l = l === "en" ? "en" : "zh";
          document.documentElement.lang = l === "en" ? "en" : "zh-CN";
          document.documentElement.setAttribute("data-lang", l);
        } catch (e) {}
      })();
    </script>
    <style>
      :root,
      :root[data-theme="dark"] {
        --bg: #0a1424;
        --card: #121d31;
        --text: #e8eef7;
        --muted: #8ea4c4;
        --accent: #3b82f6;
        --teal: #38bdf8;
        --border: #20324d;
      }
      :root[data-theme="light"] {
        --bg: #f6f9fc;
        --card: #ffffff;
        --text: #0a2540;
        --muted: #5b7290;
        --accent: #2563eb;
        --teal: #0ea5e9;
        --border: #dce6f2;
      }
      :root {
        --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
        --ease-back: cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        /* 移动端点击链接 / 按钮时去掉默认的半透明高亮背景（仅影响触屏设备） */
        -webkit-tap-highlight-color: transparent;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family:
          -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
        line-height: 1.7;
        min-height: 100vh;
        transition:
          background 0.3s,
          color 0.3s;
      }
      html {
        scroll-behavior: smooth;
      }
      #app {
        max-width: 1180px;
        margin: 0 auto;
        padding: 24px 20px 0;
      }

      /* 全局异步加载进度条：盖在顶栏之上，非遮挡、不接管布局；
         由 src/core/progress.ts 引用计数驱动，仅在有实际等待时淡入 */
      .route-progress {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
        z-index: 9999;
        pointer-events: none;
        overflow: hidden;
        opacity: 0;
        transition:
          opacity 0.26s ease,
          transform 0.26s ease;
        transform: translateY(-100%);
      }
      .route-progress.active {
        opacity: 1;
        transform: translateY(0);
      }
      .route-progress::before {
        content: "";
        position: absolute;
        top: 0;
        left: -40%;
        width: 40%;
        height: 100%;
        background: linear-gradient(
          90deg,
          transparent,
          var(--teal),
          var(--accent),
          transparent
        );
        animation: routeProgressSlide 1.1s ease-in-out infinite;
      }
      @keyframes routeProgressSlide {
        0% {
          left: -40%;
        }
        100% {
          left: 100%;
        }
      }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 50;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 0 16px;
        background: transparent;
        border: 1px solid transparent;
        transition:
          box-shadow 0.25s,
          background 0.3s,
          border-color 0.3s,
          backdrop-filter 0.3s,
          padding 0.25s;
        animation: topbarIn 0.5s var(--ease-out) both;
      }
      .topbar.scrolled {
        padding: 14px 18px 16px;
        background: color-mix(in srgb, var(--bg) 94%, transparent);
        backdrop-filter: blur(8px) saturate(150%);
        -webkit-backdrop-filter: blur(8px) saturate(150%);
        border-color: var(--border);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.16);
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        font-size: 1.25rem;
        font-weight: 700;
        text-decoration: none;
        background: linear-gradient(90deg, var(--teal), var(--accent));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .brand .mark {
        font-size: 1.35rem;
        -webkit-text-fill-color: initial;
        filter: drop-shadow(0 1px 3px rgba(0, 0, 0, 0.3));
      }
      .toolbar {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .lang-switch {
        display: inline-flex;
        border: 1px solid var(--border);
        border-radius: 20px;
        overflow: hidden;
      }
      /* 顶栏控件：选择器必须带 .toolbar 前缀，否则会把圆按钮 / 胶囊样式泄进学科内容
         （学科 hero 里的 .theme-btn / .lang-btn 与顶栏同名） */
      .toolbar .lang-btn {
        background: transparent;
        border: none;
        color: var(--muted);
        padding: 6px 16px;
        font-size: 0.85rem;
        cursor: pointer;
        transition: all 0.2s;
      }
      .toolbar .lang-btn.active {
        background: var(--accent);
        color: #fff;
        font-weight: 600;
      }
      .toolbar .theme-btn {
        background: transparent;
        border: 1px solid var(--border);
        border-radius: 50%;
        width: 38px;
        height: 38px;
        cursor: pointer;
        font-size: 1rem;
        line-height: 1;
        transition: all 0.2s;
      }
      .toolbar .theme-btn:hover {
        border-color: var(--accent);
      }
      .subjects-menu {
        position: relative;
      }
      .subjects-toggle {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: transparent;
        border: 1px solid var(--border);
        border-radius: 20px;
        color: var(--muted);
        padding: 6px 14px;
        font-size: 0.85rem;
        cursor: pointer;
        transition:
          border-color 0.2s,
          color 0.2s;
      }
      .subjects-toggle:hover,
      .subjects-toggle[aria-expanded="true"] {
        border-color: var(--accent);
        color: var(--text);
      }
      .subjects-toggle .caret {
        font-size: 0.7rem;
        transition: transform 0.2s;
      }
      .subjects-toggle[aria-expanded="true"] .caret {
        transform: rotate(180deg);
      }
      .subjects-panel {
        position: absolute;
        top: calc(100% + 10px);
        right: 0;
        left: auto;
        z-index: 100;
        min-width: min(280px, calc(100vw - 32px));
        max-height: 72vh;
        overflow: auto;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.22);
        padding: 8px;
      }
      /* 移动端「语言 + 主题」图标菜单：桌面隐藏，≤640px 取代 lang-switch + theme-btn */
      .view-menu {
        display: none;
        position: relative;
      }
      .view-menu-btn {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        background: transparent;
        border: 1px solid var(--border);
        border-radius: 20px;
        color: var(--muted);
        padding: 6px 12px;
        font-size: 1rem;
        cursor: pointer;
        transition:
          border-color 0.2s,
          color 0.2s;
      }
      .view-menu-btn:hover,
      .view-menu-btn[aria-expanded="true"] {
        border-color: var(--accent);
        color: var(--accent);
      }
      .view-menu-btn .vm-caret {
        font-size: 0.7rem;
        transition: transform 0.2s;
      }
      .view-menu-btn[aria-expanded="true"] .vm-caret {
        transform: rotate(180deg);
      }
      .view-panel {
        position: absolute;
        top: calc(100% + 10px);
        right: 0;
        left: auto;
        z-index: 100;
        width: 224px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.22);
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .view-panel[hidden] {
        display: none;
      }
      .vp-sec {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .vp-label {
        font-size: 0.72rem;
        color: var(--muted);
        letter-spacing: 0.04em;
        padding: 0 2px;
      }
      .vp-opts {
        display: flex;
        gap: 6px;
      }
      .vp-opts > button {
        flex: 1;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 8px 10px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: transparent;
        color: var(--text);
        font-family: inherit;
        font-size: 0.85rem;
        cursor: pointer;
        transition: all 0.15s;
      }
      .vp-opts > button:hover {
        border-color: var(--accent);
      }
      .vp-opts > button.active {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
        font-weight: 600;
      }
      .subject-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 12px;
        border-radius: 10px;
        text-decoration: none;
        color: var(--text);
        transition: background 0.15s;
      }
      .subject-item:hover {
        background: color-mix(in srgb, var(--accent) 10%, transparent);
      }
      .subject-item .si-emoji {
        font-size: 1.4rem;
      }
      .subject-item .si-text {
        display: flex;
        flex-direction: column;
        line-height: 1.25;
      }
      .subject-item .si-title {
        font-weight: 600;
        font-size: 0.92rem;
      }
      .subject-item .si-status {
        font-size: 0.72rem;
        color: var(--muted);
      }
      .subject-item .si-status.soon {
        color: var(--accent);
      }
      .subject-item.current {
        background: color-mix(in srgb, var(--accent) 12%, transparent);
      }
      .subject-item.current .si-title {
        color: var(--accent);
      }
      /* 学科菜单仅在学科页（subject-mode）显示；首页已有学科卡片网格，避免冗余 */
      #app:not(.subject-mode) .subjects-menu {
        display: none;
      }

      .hero {
        text-align: center;
        margin: 4px 0 40px;
        position: relative;
        overflow: hidden;
        padding: 14px 24px 36px;
        background:
          radial-gradient(
            120% 130% at 50% -20%,
            rgba(56, 189, 248, 0.16),
            transparent 55%
          ),
          radial-gradient(
            100% 120% at 100% -10%,
            rgba(59, 130, 246, 0.12),
            transparent 60%
          );
      }
      .hero::after {
        content: "";
        position: absolute;
        left: 10%;
        right: 10%;
        top: -25%;
        height: 75%;
        background: radial-gradient(
          60% 100% at 50% 0%,
          rgba(56, 189, 248, 0.2),
          transparent 70%
        );
        filter: blur(10px);
        opacity: 0.9;
        z-index: 0;
        pointer-events: none;
        animation: heroBreath 7s ease-in-out infinite;
      }
      .hero > * {
        position: relative;
        z-index: 1;
      }
      /* 入场动画仅限首页 hero：裸类名 .hero>* 会一并命中学科 hero，若不限定则
         每次切换学科都重跑 riseIn（both 使其先停在 opacity:0 再淡入）＝「先结构后闪出内容」。 */
      #app:not(.subject-mode) .hero > * {
        animation: riseIn 0.6s var(--ease-out) both;
      }
      .hero h1 {
        animation-delay: 0.06s;
        font-size: 2.6rem;
        font-weight: 700;
        letter-spacing: 0.5px;
        background: linear-gradient(90deg, var(--teal), var(--accent));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .hero .subtitle {
        animation-delay: 0.15s;
        color: var(--text);
        font-size: 1.05rem;
        margin-top: 8px;
        opacity: 0.9;
      }
      .hero .intro {
        animation-delay: 0.24s;
        color: var(--muted);
        font-size: 0.95rem;
        max-width: 720px;
        margin: 14px auto 0;
        line-height: 1.8;
      }
      .stats {
        display: flex;
        justify-content: center;
        gap: 14px;
        flex-wrap: wrap;
        margin-top: 24px;
      }
      .stat {
        min-width: 130px;
        padding: 14px 22px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.03);
      }
      .stat .num {
        font-size: 1.8rem;
        font-weight: 700;
        background: linear-gradient(90deg, var(--teal), var(--accent));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .stat .label {
        font-size: 0.8rem;
        color: var(--muted);
        margin-top: 2px;
      }

      .nav {
        display: flex;
        justify-content: center;
        gap: 12px;
        flex-wrap: wrap;
        margin: 24px 0 32px;
      }
      .nav a {
        text-decoration: none;
        color: var(--muted);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 6px 18px;
        font-size: 0.85rem;
        transition: all 0.2s;
      }
      .nav a:hover {
        color: var(--accent);
        border-color: var(--accent);
      }

      .section {
        margin-bottom: 44px;
      }
      .section h2 {
        font-size: 1.25rem;
        color: var(--accent);
        border-left: 3px solid var(--accent);
        padding-left: 12px;
        margin-bottom: 18px;
      }
      .card-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 20px;
      }
      .card {
        position: relative;
        background: var(--card);
        border: 1px solid var(--border);
        border-top: 3px solid var(--teal);
        border-radius: 12px;
        padding: 24px;
        transition:
          transform 0.28s var(--ease-out),
          border-color 0.2s,
          box-shadow 0.28s var(--ease-out),
          background 0.3s;
        display: flex;
        flex-direction: column;
      }
      /* 卡片入场同样仅限首页；学科里的 .card 由各学科样式接管，不应重跑 riseIn。 */
      #app:not(.subject-mode) .card {
        animation: riseIn 0.55s var(--ease-out) both;
        animation-delay: calc(0.28s + var(--i, 0) * 0.06s);
      }
      .card:hover {
        transform: translateY(-6px) scale(1.015);
        box-shadow:
          0 0 0 1px var(--accent),
          0 16px 40px rgba(0, 0, 0, 0.22);
      }
      .card.soon {
        opacity: 0.82;
        border-top-color: var(--border);
      }
      .card .emoji {
        font-size: 2rem;
        translate: 0 0;
        will-change: translate;
        transition: transform 0.35s var(--ease-back);
        animation: emojiFloat 4.2s ease-in-out infinite;
        animation-delay: calc(var(--i, 0) * -0.55s);
      }
      .card:hover .emoji {
        transform: scale(1.18) rotate(-7deg);
      }
      .card-head {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 12px;
      }
      .card-titles {
        min-width: 0;
      }
      .card.featured {
        flex-direction: row;
        align-items: center;
        gap: 28px;
      }
      .card.featured .emoji {
        font-size: 4rem;
        margin: 0;
        flex: 0 0 auto;
      }
      .card.featured .card-main {
        flex: 1;
        display: flex;
        flex-direction: column;
      }
      .card.featured .desc {
        margin: 8px 0;
      }
      .card h3 {
        font-size: 1.15rem;
        color: var(--teal);
        margin-bottom: 2px;
      }
      .card .sub-en {
        color: var(--muted);
        font-size: 0.82rem;
        margin-bottom: 0;
      }
      .card .desc {
        color: var(--muted);
        font-size: 0.9rem;
        line-height: 1.7;
        margin: 6px 0 4px;
        flex-grow: 1;
      }
      .card .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 14px;
      }
      .chip {
        font-size: 0.72rem;
        color: var(--muted);
        background: rgba(154, 165, 177, 0.12);
        border: 1px solid var(--border);
        padding: 2px 9px;
        border-radius: 10px;
      }
      .status {
        display: inline-block;
        font-size: 0.72rem;
        padding: 2px 10px;
        border-radius: 12px;
        margin-left: 8px;
        vertical-align: middle;
      }
      .status.online {
        background: rgba(56, 189, 248, 0.15);
        color: var(--teal);
      }
      .status.first {
        background: rgba(59, 130, 246, 0.16);
        color: var(--accent);
      }
      .status.soon {
        background: rgba(142, 164, 196, 0.15);
        color: var(--muted);
      }
      .status.wip {
        background: rgba(59, 130, 246, 0.12);
        color: var(--accent);
      }
      .gh-link {
        position: relative;
        z-index: 2;
        display: inline-block;
        margin-top: 4px;
        font-size: 0.82rem;
        color: var(--accent);
        text-decoration: none;
      }
      .gh-link:hover {
        text-decoration: underline;
      }
      .btn {
        display: inline-block;
        margin-top: 16px;
        text-decoration: none;
        background: var(--accent);
        color: #fff;
        font-weight: 600;
        padding: 8px 16px;
        border-radius: 8px;
        font-size: 0.85rem;
        transition: opacity 0.2s;
        text-align: center;
        position: relative;
        z-index: 2;
      }
      .btn:hover {
        opacity: 0.85;
      }
      .btn.disabled {
        background: transparent;
        color: var(--muted);
        border: 1px solid var(--border);
        cursor: not-allowed;
        pointer-events: none;
      }
      code {
        font-family: "SF Mono", Consolas, monospace;
        background: rgba(154, 165, 177, 0.15);
        padding: 2px 6px;
        border-radius: 4px;
        font-size: 0.88em;
        color: var(--teal);
      }
      .note {
        background: rgba(59, 130, 246, 0.08);
        border: 1px dashed var(--border);
        border-radius: 12px;
        padding: 16px 20px;
        color: var(--muted);
        font-size: 0.85rem;
        margin-top: 16px;
      }

      /* subject 内部（dynasty 等） */
      .subject .sub-head {
        margin-bottom: 20px;
      }
      .subject .sub-head h2 {
        font-size: 1.6rem;
        color: var(--teal);
      }
      .subject .sub-head p {
        color: var(--muted);
      }
      .subject .era {
        font-size: 0.72rem;
        color: var(--accent);
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }
      .subject .years {
        color: var(--muted);
        font-size: 0.82rem;
        margin: 2px 0 8px;
        font-family: "SF Mono", Consolas, monospace;
      }

      .soon-wrap {
        text-align: center;
        padding: 80px 20px;
        color: var(--muted);
      }
      .soon-wrap h2 {
        font-size: 1.6rem;
        color: var(--accent);
        margin-bottom: 10px;
      }

      .site-footer {
        text-align: center;
        color: var(--muted);
        font-size: 0.85rem;
        padding: 40px 0;
      }
      .subject-frame {
        width: 100%;
        min-height: 86vh;
        border: 0;
        background: var(--bg);
      }
      /* subject（dynasty / econ / mind 等）页面全宽，首页保持 1080px 卡片布局 */
      #app.subject-mode {
        max-width: none;
        padding: 0;
      }
      /* subject 模式（iframe 学科页）：去掉硬分隔线，对齐左右安全边距 */
      #app.subject-mode .topbar {
        margin-bottom: 0;
        padding-left: 24px;
        padding-right: 24px;
      }
      #app.subject-mode .site-footer {
        padding-left: 24px;
        padding-right: 24px;
      }
      /* 顶栏是语言 / 主题的唯一切换入口：各学科 hero 内的按钮已从模板里移除，
         仅中华王朝保留（深色渐变上的玻璃胶囊），点击经 src/core/viewControls.ts
         桥接到主应用状态，与顶栏同源。 */
      /* 首页返回顶部按钮（与学科页 to-top 行为一致） */
      .to-top-home {
        position: fixed;
        right: 22px;
        bottom: 22px;
        z-index: 60;
        width: 46px;
        height: 46px;
        border: none;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--teal), var(--accent));
        color: #fff;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        opacity: 0;
        transform: translateY(14px) scale(0.92);
        pointer-events: none;
        transition:
          opacity 0.25s ease,
          transform 0.4s var(--ease-back),
          filter 0.15s;
      }
      .to-top-home.show {
        opacity: 1;
        transform: translateY(0) scale(1);
        pointer-events: auto;
      }
      .to-top-home:hover {
        filter: brightness(1.1);
      }
      .to-top-home svg {
        width: 22px;
        height: 22px;
      }
      /* ===== 首页专属：全宽 + 富内容 =====
         统一限定 #app:not(.subject-mode)（学科页恒为 .subject-mode），
         确保只改首页、不影响任何学科页。 */
      #app:not(.subject-mode) {
        max-width: none;
        padding-left: clamp(16px, 4vw, 56px);
        padding-right: clamp(16px, 4vw, 56px);
      }
      /* ---------- Hero：双栏 + 产品预览 ---------- */
      #app:not(.subject-mode) .hero {
        display: grid;
        grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.95fr);
        align-items: center;
        gap: clamp(28px, 4vw, 64px);
        margin: 12px 0 0;
        padding: clamp(34px, 4.8vw, 76px) clamp(22px, 3.6vw, 60px);
        text-align: left;
        border: 1px solid var(--border);
        border-radius: 28px;
        background:
          radial-gradient(
            80% 110% at 0% 0%,
            rgba(56, 189, 248, 0.16),
            transparent 58%
          ),
          radial-gradient(
            70% 100% at 100% 8%,
            rgba(59, 130, 246, 0.15),
            transparent 60%
          ),
          linear-gradient(
            180deg,
            color-mix(in srgb, var(--card) 86%, transparent),
            color-mix(in srgb, var(--card) 55%, transparent)
          );
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.1);
      }
      #app:not(.subject-mode) .hero-copy {
        max-width: 640px;
        animation-delay: 0.04s;
      }
      #app:not(.subject-mode) .hero .kicker {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        margin-bottom: 22px;
        padding: 6px 14px;
        font-size: 0.76rem;
        letter-spacing: 0.04em;
        color: var(--muted);
        border: 1px solid var(--border);
        border-radius: 999px;
        background: color-mix(in srgb, var(--card) 75%, transparent);
      }
      #app:not(.subject-mode) .dot {
        flex: 0 0 auto;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #22c55e;
        box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.16);
      }
      #app:not(.subject-mode) .hero h1 {
        margin: 0;
        font-size: clamp(2.35rem, 3.6vw + 1rem, 4.2rem);
        font-weight: 800;
        line-height: 1.08;
        letter-spacing: -0.025em;
        color: var(--text);
        background: none;
        -webkit-background-clip: border-box;
        background-clip: border-box;
      }
      #app:not(.subject-mode) .hero h1 .h1-line {
        display: block;
      }
      #app:not(.subject-mode) .hero h1 .h1-accent {
        color: transparent;
        background: linear-gradient(92deg, var(--teal), var(--accent));
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      #app:not(.subject-mode) .hero .home-lead {
        max-width: 560px;
        margin: 20px 0 0;
        font-size: clamp(0.95rem, 0.9rem + 0.2vw, 1.05rem);
        line-height: 1.85;
        color: var(--muted);
        text-align: left;
      }
      #app:not(.subject-mode) .hero-note {
        margin: 16px 0 0;
        font-size: 0.78rem;
        letter-spacing: 0.02em;
        color: var(--muted);
      }
      #app:not(.subject-mode) .home-cta {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
        margin-top: 28px;
      }
      #app:not(.subject-mode) .cta {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 11px 22px;
        font-size: 0.92rem;
        font-weight: 600;
        text-decoration: none;
        border: 1px solid transparent;
        border-radius: 999px;
        cursor: pointer;
        transition:
          transform 0.2s var(--ease-out),
          opacity 0.2s,
          box-shadow 0.2s;
      }
      #app:not(.subject-mode) .cta-primary {
        color: #fff;
        background: linear-gradient(90deg, var(--teal), var(--accent));
        box-shadow: 0 10px 26px rgba(0, 0, 0, 0.18);
      }
      #app:not(.subject-mode) .cta-ghost {
        color: var(--text);
        background: transparent;
        border-color: var(--border);
      }
      #app:not(.subject-mode) .cta:hover {
        transform: translateY(-2px);
        opacity: 0.92;
      }

      /* ---------- Hero 右侧：产品界面预览 ---------- */
      #app:not(.subject-mode) .hero-visual {
        position: relative;
        min-width: 0;
        animation-delay: 0.16s;
      }
      #app:not(.subject-mode) .hv-window {
        position: relative;
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: 18px;
        background: color-mix(in srgb, var(--card) 94%, transparent);
        box-shadow: 0 28px 70px rgba(0, 0, 0, 0.22);
      }
      #app:not(.subject-mode) .hv-bar {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 11px 14px;
        border-bottom: 1px solid var(--border);
        background: color-mix(in srgb, var(--card) 60%, transparent);
      }
      #app:not(.subject-mode) .hv-dots {
        display: inline-flex;
        gap: 5px;
      }
      #app:not(.subject-mode) .hv-dots i {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #f87171;
      }
      #app:not(.subject-mode) .hv-dots i:nth-child(2) {
        background: #fbbf24;
      }
      #app:not(.subject-mode) .hv-dots i:nth-child(3) {
        background: #34d399;
      }
      #app:not(.subject-mode) .hv-url {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.68rem;
        color: var(--muted);
      }
      #app:not(.subject-mode) .hv-body {
        padding: 14px;
      }
      #app:not(.subject-mode) .hv-search {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        font-size: 0.76rem;
        color: var(--muted);
        background: color-mix(in srgb, var(--card) 55%, transparent);
        border: 1px solid var(--border);
        border-radius: 10px;
      }
      #app:not(.subject-mode) .hv-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin: 12px 0 4px;
      }
      #app:not(.subject-mode) .hv-chips span {
        padding: 4px 9px;
        font-size: 0.66rem;
        color: var(--muted);
        border: 1px solid var(--border);
        border-radius: 999px;
      }
      #app:not(.subject-mode) .hv-chips .on {
        color: #fff;
        background: linear-gradient(90deg, var(--teal), var(--accent));
        border-color: transparent;
      }
      #app:not(.subject-mode) .hv-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 4px;
        border-top: 1px solid var(--border);
      }
      #app:not(.subject-mode) .hv-list .hv-row:first-child {
        border-top: 0;
      }
      #app:not(.subject-mode) .hv-ico {
        display: grid;
        flex: 0 0 auto;
        place-items: center;
        width: 30px;
        height: 30px;
        font-size: 0.95rem;
        border-radius: 9px;
        background: color-mix(in srgb, var(--accent) 10%, transparent);
      }
      #app:not(.subject-mode) .hv-meta {
        flex: 1;
        min-width: 0;
      }
      #app:not(.subject-mode) .hv-meta b {
        display: block;
        overflow: hidden;
        font-size: 0.82rem;
        color: var(--text);
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #app:not(.subject-mode) .hv-meta i {
        display: block;
        margin-top: 2px;
        overflow: hidden;
        font-size: 0.66rem;
        font-style: normal;
        color: var(--muted);
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #app:not(.subject-mode) .hv-go {
        flex: 0 0 auto;
        font-size: 0.88rem;
        color: var(--accent);
      }
      #app:not(.subject-mode) .hv-float {
        position: absolute;
        display: flex;
        flex-direction: column;
        gap: 1px;
        padding: 10px 14px;
        background: color-mix(in srgb, var(--card) 92%, transparent);
        border: 1px solid var(--border);
        border-radius: 12px;
        box-shadow: 0 14px 34px rgba(0, 0, 0, 0.18);
        backdrop-filter: blur(8px);
      }
      #app:not(.subject-mode) .hv-float b {
        font-size: 0.95rem;
        color: var(--text);
      }
      #app:not(.subject-mode) .hv-float span {
        font-size: 0.66rem;
        color: var(--muted);
      }
      #app:not(.subject-mode) .hv-float-a {
        top: -14px;
        right: 16px;
      }
      /* ---------- 数据条 ---------- */
      #app:not(.subject-mode) .metrics {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        margin: 22px 0 0;
        padding: 8px 0;
        background: color-mix(in srgb, var(--card) 55%, transparent);
        border: 1px solid var(--border);
        border-radius: 20px;
      }
      #app:not(.subject-mode) .metric {
        padding: 18px 14px;
        text-align: center;
        border-left: 1px solid var(--border);
      }
      #app:not(.subject-mode) .metric:first-child {
        border-left: 0;
      }
      #app:not(.subject-mode) .metric .num {
        font-size: clamp(1.7rem, 2.4vw, 2.4rem);
        font-weight: 800;
        letter-spacing: -0.02em;
        color: transparent;
        background: linear-gradient(90deg, var(--teal), var(--accent));
        -webkit-background-clip: text;
        background-clip: text;
      }
      #app:not(.subject-mode) .metric .label {
        margin-top: 4px;
        font-size: 0.78rem;
        letter-spacing: 0.04em;
        color: var(--muted);
      }

      /* ---------- 学科带 ---------- */
      #app:not(.subject-mode) .subject-strip {
        display: flex;
        align-items: center;
        gap: 18px;
        margin: 18px 0 0;
        padding: 16px 2px 18px;
        border-bottom: 1px solid var(--border);
      }
      #app:not(.subject-mode) .strip-label {
        flex: 0 0 auto;
        font-size: 0.7rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
      }
      #app:not(.subject-mode) .strip-list {
        display: flex;
        gap: 8px;
        /* overflow-x:auto 会把纵向也变成裁切；留出上下余量，
           让 strip-item 的 hover 上浮不被切边。 */
        padding: 5px 2px;
        margin: -5px 0;
        overflow-x: auto;
        scrollbar-width: none;
      }
      #app:not(.subject-mode) .strip-list::-webkit-scrollbar {
        display: none;
      }
      #app:not(.subject-mode) .strip-item {
        display: inline-flex;
        flex: 0 0 auto;
        align-items: center;
        gap: 7px;
        padding: 6px 12px;
        font-size: 0.8rem;
        color: var(--muted);
        white-space: nowrap;
        background: color-mix(in srgb, var(--card) 50%, transparent);
        border: 1px solid var(--border);
        border-radius: 999px;
      }
      #app:not(.subject-mode) .strip-item i {
        font-size: 0.9rem;
        font-style: normal;
      }

      /* ---------- 区块标题 ---------- */
      #app:not(.subject-mode) .features {
        margin: clamp(56px, 7vw, 96px) 0 0;
        scroll-margin-top: 92px;
      }
      #app:not(.subject-mode) .section {
        margin-top: clamp(56px, 7vw, 96px);
      }
      #app:not(.subject-mode) .sec-head {
        max-width: 800px;
        margin: 0 0 26px;
      }
      #app:not(.subject-mode) .sec-eyebrow {
        display: inline-block;
        margin-bottom: 10px;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--accent);
      }
      #app:not(.subject-mode) .sec-head h2 {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
        margin: 0 0 12px;
        padding: 0;
        font-size: clamp(1.5rem, 2.4vw, 2.25rem);
        line-height: 1.2;
        letter-spacing: -0.015em;
        color: var(--text);
        border: 0;
      }
      #app:not(.subject-mode) .sec-head p {
        max-width: 680px;
        margin: 0;
        font-size: 0.95rem;
        line-height: 1.8;
        color: var(--muted);
      }
      #app:not(.subject-mode) .sec-count {
        padding: 1px 9px;
        font-size: 0.72rem;
        font-weight: 600;
        color: var(--muted);
        border: 1px solid var(--border);
        border-radius: 999px;
      }

      /* ---------- 首页动效 ----------
         滚动入场只动 opacity / translate，避免覆盖卡片 hover 的 transform。 */
      #app:not(.subject-mode) .reveal {
        opacity: 0;
      }
      #app:not(.subject-mode) .reveal.is-in {
        animation: revealUp 0.62s var(--ease-out) both;
        animation-delay: var(--d, 0s);
      }
      #app:not(.subject-mode) .bento-card:nth-child(2) {
        --d: 0.05s;
      }
      #app:not(.subject-mode) .bento-card:nth-child(3) {
        --d: 0.1s;
      }
      #app:not(.subject-mode) .bento-card:nth-child(4) {
        --d: 0.15s;
      }
      #app:not(.subject-mode) .bento-card:nth-child(5) {
        --d: 0.2s;
      }
      #app:not(.subject-mode) .bento-card:nth-child(6) {
        --d: 0.25s;
      }
      #app:not(.subject-mode) .aud-card:nth-child(2) {
        --d: 0.06s;
      }
      #app:not(.subject-mode) .aud-card:nth-child(3) {
        --d: 0.12s;
      }
      #app:not(.subject-mode) .aud-card:nth-child(4) {
        --d: 0.18s;
      }
      #app:not(.subject-mode) .step:nth-child(2) {
        --d: 0.08s;
      }
      #app:not(.subject-mode) .step:nth-child(3) {
        --d: 0.16s;
      }
      #app:not(.subject-mode) .faq-item:nth-child(2) {
        --d: 0.03s;
      }
      #app:not(.subject-mode) .faq-item:nth-child(3) {
        --d: 0.06s;
      }
      #app:not(.subject-mode) .faq-item:nth-child(4) {
        --d: 0.09s;
      }
      #app:not(.subject-mode) .faq-item:nth-child(5) {
        --d: 0.12s;
      }
      #app:not(.subject-mode) .faq-item:nth-child(6) {
        --d: 0.15s;
      }

      /* Hero 预览：窗口缓慢浮动，结果逐行浮现 */
      #app:not(.subject-mode) .hv-row {
        animation: hvRowIn 0.5s var(--ease-out) both;
      }
      #app:not(.subject-mode) .hv-list .hv-row:nth-child(1) {
        animation-delay: 0.45s;
      }
      #app:not(.subject-mode) .hv-list .hv-row:nth-child(2) {
        animation-delay: 0.55s;
      }
      #app:not(.subject-mode) .hv-list .hv-row:nth-child(3) {
        animation-delay: 0.65s;
      }
      #app:not(.subject-mode) .hv-list .hv-row:nth-child(4) {
        animation-delay: 0.75s;
      }
      #app:not(.subject-mode) .hv-window {
        animation: hvFloat 8s ease-in-out infinite;
      }
      #app:not(.subject-mode) .hv-float {
        animation: hvFloatCard 6.5s ease-in-out infinite -2.2s;
      }

      /* 标题渐变缓慢流动 + 主按钮光泽扫过 */
      #app:not(.subject-mode) .hero h1 .h1-accent {
        background-size: 220% 100%;
        animation: gradientShift 9s ease-in-out infinite;
      }
      #app:not(.subject-mode) .cta-primary {
        position: relative;
        overflow: hidden;
      }
      #app:not(.subject-mode) .cta-primary::after {
        position: absolute;
        inset: 0;
        content: "";
        background: linear-gradient(
          110deg,
          transparent 32%,
          rgba(255, 255, 255, 0.32) 50%,
          transparent 68%
        );
        transform: translateX(-130%);
        animation: ctaShine 5.5s ease-in-out infinite;
        pointer-events: none;
      }

      /* 卡片与标签的 hover 微动 */
      #app:not(.subject-mode) .bento-card {
        transition:
          transform 0.3s var(--ease-out),
          border-color 0.2s,
          box-shadow 0.3s;
      }
      #app:not(.subject-mode) .bento-card:hover {
        transform: translateY(-4px);
        border-color: color-mix(in srgb, var(--accent) 35%, var(--border));
        box-shadow: 0 18px 46px rgba(0, 0, 0, 0.12);
      }
      #app:not(.subject-mode) .strip-item {
        transition:
          transform 0.2s var(--ease-out),
          border-color 0.2s,
          color 0.2s;
      }
      #app:not(.subject-mode) .strip-item:hover {
        transform: translateY(-2px);
        color: var(--text);
        border-color: color-mix(in srgb, var(--accent) 40%, var(--border));
      }
      #app:not(.subject-mode) .faq-item[open] > p {
        animation: faqIn 0.28s var(--ease-out);
      }

      /* 主标题：两行字从遮罩下依次升起 */
      #app:not(.subject-mode) .hero h1 .h1-line {
        padding-bottom: 0.14em;
        margin-bottom: -0.14em;
        overflow: hidden;
      }
      #app:not(.subject-mode) .hero h1 .h1-line-in {
        display: block;
        animation: lineRise 0.9s var(--ease-out) both;
      }
      #app:not(.subject-mode) .hero h1 .h1-line:nth-child(2) .h1-line-in {
        animation-delay: 0.14s;
      }

      /* 区块标题：眉标 → 标题 → 描述依次入场 */
      #app:not(.subject-mode) .sec-head.reveal.is-in {
        animation: revealFade 0.5s var(--ease-out) both;
      }
      #app:not(.subject-mode) .sec-head.reveal.is-in .sec-eyebrow {
        animation: textUp 0.55s var(--ease-out) both;
      }
      #app:not(.subject-mode) .sec-head.reveal.is-in h2 {
        animation: textUp 0.55s var(--ease-out) 0.07s both;
      }
      #app:not(.subject-mode) .sec-head.reveal.is-in p {
        animation: textUp 0.55s var(--ease-out) 0.14s both;
      }

      /* 搜索框打字机光标 */
      #app:not(.subject-mode) .hv-query::after {
        display: inline-block;
        width: 1px;
        height: 1.05em;
        margin-left: 2px;
        content: "";
        vertical-align: -0.18em;
        background: var(--accent);
        animation: caretBlink 1.1s steps(2, start) infinite;
      }

      /* 文字链接：下划线从左滑入 */
      #app:not(.subject-mode) .sf-col a,
      #app:not(.subject-mode) .sf-col button,
      #app:not(.subject-mode) .faq-more a {
        background-image: linear-gradient(90deg, var(--teal), var(--accent));
        background-repeat: no-repeat;
        background-position: 0 100%;
        background-size: 0% 1.5px;
        transition:
          background-size 0.35s var(--ease-out),
          color 0.2s;
      }
      #app:not(.subject-mode) .sf-col a:hover,
      #app:not(.subject-mode) .sf-col button:hover,
      #app:not(.subject-mode) .faq-more a:hover {
        background-size: 100% 1.5px;
      }

      /* FAQ 问题文字 hover 时轻微右移 */
      #app:not(.subject-mode) .faq-item summary span {
        transition: translate 0.25s var(--ease-out);
      }
      #app:not(.subject-mode) .faq-item summary:hover span {
        translate: 4px 0;
      }

      /* ---------- Bento 特性 ---------- */
      #app:not(.subject-mode) .bento {
        display: grid;
        grid-template-columns: repeat(12, minmax(0, 1fr));
        gap: 16px;
      }
      #app:not(.subject-mode) .bento-card {
        display: flex;
        flex-direction: column;
        gap: 8px;
        min-height: 218px;
        padding: 24px;
        overflow: hidden;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 18px;
      }
      #app:not(.subject-mode) .bento-main {
        grid-column: span 7;
        grid-row: span 2;
        background:
          radial-gradient(
            120% 120% at 0% 0%,
            rgba(56, 189, 248, 0.14),
            transparent 58%
          ),
          radial-gradient(
            80% 80% at 102% 104%,
            rgba(59, 130, 246, 0.1),
            transparent 62%
          ),
          linear-gradient(
            color-mix(in srgb, var(--border) 42%, transparent) 1px,
            transparent 1px
          ),
          linear-gradient(
            90deg,
            color-mix(in srgb, var(--border) 42%, transparent) 1px,
            transparent 1px
          ),
          var(--card);
        background-size:
          auto,
          auto,
          28px 28px,
          28px 28px,
          auto;
      }
      #app:not(.subject-mode) .bento-card:nth-child(2),
      #app:not(.subject-mode) .bento-card:nth-child(3) {
        grid-column: span 5;
      }

      #app:not(.subject-mode) .bento-tag {

      #app:not(.subject-mode) .bento-card h3 {

      #app:not(.subject-mode) .bento-card p {

      #app:not(.subject-mode) .tl-item i {

      #app:not(.subject-mode) .bento-lang .segs span {
        padding: 4px 12px;
        font-size: 0.72rem;
        color: var(--muted);

      #app:not(.subject-mode) .bento-lang .segs .on {
        color: #fff;
        background: linear-gradient(90deg, var(--teal), var(--accent));
      }
      #app:not(.subject-mode) .bento-lang > i {
        display: block;
        height: 8px;
        background: color-mix(in srgb, var(--muted) 18%, transparent);
        border-radius: 4px;

      #app:not(.subject-mode) .bento-url {

        padding: 10px 12px;

      #app:not(.subject-mode) .bento-code {

        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;

      #app:not(.subject-mode) .bento-code b {
        color: var(--teal);

      #app:not(.subject-mode) .bento-repo {
        display: flex;
        align-items: center;

        margin-top: auto;

      #app:not(.subject-mode) .bento-repo .hv-go {

      #app:not(.subject-mode) .dot-live {
        flex: 0 0 auto;

        height: 8px;
        background: #22c55e;
        border-radius: 50%;
        box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.15);
      }

      /* ---------- 适用人群 ---------- */
      #app:not(.subject-mode) .audience,
      #app:not(.subject-mode) .steps,
      #app:not(.subject-mode) .faq {
        margin-top: clamp(56px, 7vw, 96px);
        scroll-margin-top: 92px;
      }
      #app:not(.subject-mode) .aud-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 16px;
      }
      #app:not(.subject-mode) .aud-card {
        padding: 24px;
        background: color-mix(in srgb, var(--card) 70%, transparent);
        border: 1px solid var(--border);
        border-radius: 18px;
        transition:
          transform 0.25s var(--ease-out),
          border-color 0.2s;
      }
      #app:not(.subject-mode) .aud-card:hover {
        transform: translateY(-4px);
        border-color: color-mix(in srgb, var(--accent) 45%, var(--border));
      }
      #app:not(.subject-mode) .aud-ico {
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        font-size: 1.25rem;
        background: color-mix(in srgb, var(--accent) 10%, transparent);
        border: 1px solid color-mix(in srgb, var(--accent) 18%, transparent);
        border-radius: 12px;
      }
      #app:not(.subject-mode) .aud-card h3 {
        margin: 16px 0 6px;
        font-size: 1rem;
        color: var(--text);
      }
      #app:not(.subject-mode) .aud-card p {
        margin: 0;
        font-size: 0.86rem;
        line-height: 1.75;
        color: var(--muted);
      }

      /* ---------- 三步使用 ---------- */
      #app:not(.subject-mode) .steps-list {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: clamp(20px, 3vw, 40px);
        margin: 0;
        padding: 0;
        list-style: none;
      }
      #app:not(.subject-mode) .step {
        position: relative;
        min-width: 0;
        padding: 26px 24px 34px;
        background: linear-gradient(
          165deg,
          color-mix(in srgb, var(--card) 88%, transparent),
          color-mix(in srgb, var(--card) 42%, transparent)
        );
        border: 1px solid var(--border);
        border-radius: 20px;
        transition:
          transform 0.3s var(--ease-out),
          border-color 0.2s,
          box-shadow 0.3s;
      }
      #app:not(.subject-mode) .step:hover {
        transform: translateY(-5px);
        border-color: color-mix(in srgb, var(--teal) 40%, var(--border));
        box-shadow: 0 22px 52px rgba(0, 0, 0, 0.12);
      }
      /* 右上角水印序号 */
      #app:not(.subject-mode) .step-ghost {
        position: absolute;
        top: 4px;
        right: 14px;
        font-size: 4.4rem;
        font-weight: 800;
        line-height: 1;
        letter-spacing: -0.05em;
        color: transparent;
        background: linear-gradient(150deg, var(--teal), var(--accent));
        -webkit-background-clip: text;
        background-clip: text;
        opacity: 0.13;
        transition:
          opacity 0.3s,
          translate 0.45s var(--ease-out);
      }
      #app:not(.subject-mode) .step:hover .step-ghost {
        opacity: 0.26;
        translate: 0 -4px;
      }
      #app:not(.subject-mode) .step-ico {
        display: grid;
        width: 46px;
        height: 46px;
        place-items: center;
        color: var(--teal);
        background: color-mix(in srgb, var(--teal) 12%, transparent);
        border: 1px solid color-mix(in srgb, var(--teal) 26%, transparent);
        border-radius: 14px;
        transition:
          transform 0.35s var(--ease-out),
          background 0.3s;
      }
      #app:not(.subject-mode) .step-ico svg {
        width: 22px;
        height: 22px;
      }
      #app:not(.subject-mode) .step:hover .step-ico {
        transform: rotate(-6deg) scale(1.06);
      }
      #app:not(.subject-mode) .step-tag {
        display: block;
        margin: 20px 0 6px;
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--muted);
      }
      #app:not(.subject-mode) .step h3 {
        margin: 0 0 8px;
        font-size: 1.12rem;
        color: var(--text);
      }
      #app:not(.subject-mode) .step p {
        margin: 0;
        font-size: 0.88rem;
        line-height: 1.75;
        color: var(--muted);
      }
      /* 底部递进进度条：三步分别走到 1/3、2/3、满格 */
      #app:not(.subject-mode) .step-bar {
        position: absolute;
        right: 24px;
        bottom: 16px;
        left: 24px;
        height: 3px;
        background: color-mix(in srgb, var(--border) 75%, transparent);
        border-radius: 999px;
      }
      #app:not(.subject-mode) .step-bar i {
        display: block;
        height: 100%;
        background: linear-gradient(90deg, var(--teal), var(--accent));
        border-radius: 999px;
        transform: scaleX(0);
        transform-origin: left center;
        transition: transform 0.9s var(--ease-out) 0.2s;
      }
      #app:not(.subject-mode) .step:nth-child(1) .step-bar i {
        width: 33.33%;
      }
      #app:not(.subject-mode) .step:nth-child(2) .step-bar i {
        width: 66.66%;
      }
      #app:not(.subject-mode) .step:nth-child(3) .step-bar i {
        width: 100%;
      }
      #app:not(.subject-mode) .step.is-in .step-bar i {
        transform: scaleX(1);
      }
      /* 第三步用主色收尾，让三段有递进感 */
      #app:not(.subject-mode) .step:last-child {
        border-color: color-mix(in srgb, var(--accent) 26%, var(--border));
      }
      #app:not(.subject-mode) .step:last-child .step-ico {
        color: var(--accent);
        background: color-mix(in srgb, var(--accent) 12%, transparent);
        border-color: color-mix(in srgb, var(--accent) 28%, transparent);
      }
      /* 卡片之间的虚线连接（仅桌面） */
      #app:not(.subject-mode) .step-line {
        position: absolute;
        top: 47px;
        left: calc(100% + 7px);
        width: calc(clamp(20px, 3vw, 40px) - 14px);
        height: 2px;
        z-index: 2;
        background: repeating-linear-gradient(
          90deg,
          var(--muted) 0 5px,
          transparent 5px 11px
        );
        opacity: 0.6;
        transform: scaleX(0);
        transform-origin: left center;
      }
      #app:not(.subject-mode) .step-line::after {
        position: absolute;
        top: -4px;
        right: 0;
        width: 7px;
        height: 7px;
        content: "";
        border-top: 1.5px solid var(--muted);
        border-right: 1.5px solid var(--muted);
        opacity: 0.85;
        transform: rotate(45deg);
      }
      #app:not(.subject-mode) .step.is-in .step-line {
        animation: lineGrow 0.7s var(--ease-out) 0.45s forwards;
      }

      /* ---------- FAQ ---------- */
      #app:not(.subject-mode) .faq-wrap {
        display: grid;
        grid-template-columns: minmax(0, 0.85fr) minmax(0, 1.55fr);
        gap: clamp(28px, 5vw, 72px);

      #app:not(.subject-mode) .faq .sec-head {
        margin-bottom: 0;

      #app:not(.subject-mode) .faq-more {

        font-size: 0.86rem;
        line-height: 1.8;
        color: var(--muted);

      #app:not(.subject-mode) .faq-more a {
        color: var(--accent);
        text-decoration: none;
      }
      #app:not(.subject-mode) .faq-more a:hover {
        text-decoration: underline;
      }
      #app:not(.subject-mode) .faq-list {
        max-width: none;
        border-top: 1px solid var(--border);
      }
      #app:not(.subject-mode) .faq-item {
        border-bottom: 1px solid var(--border);
      }
      #app:not(.subject-mode) .faq-item summary {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        padding: 18px 2px;
        font-size: 0.95rem;
        font-weight: 600;
        color: var(--text);
        cursor: pointer;
        list-style: none;
      }
      #app:not(.subject-mode) .faq-item summary::-webkit-details-marker {
        display: none;
      }
      #app:not(.subject-mode) .faq-item summary:hover {
        color: var(--accent);
      }
      #app:not(.subject-mode) .faq-item summary i {
        flex: 0 0 auto;
        width: 24px;
        height: 24px;
        font-size: 1.1rem;
        font-style: normal;
        font-weight: 400;
        line-height: 22px;
        text-align: center;
        color: var(--accent);
        border: 1px solid var(--border);
        border-radius: 50%;
        transition: transform 0.25s var(--ease-out);
      }
      #app:not(.subject-mode) .faq-item[open] summary i {
        transform: rotate(45deg);
      }
      #app:not(.subject-mode) .faq-item p {
        max-width: 70ch;
        margin: 0;
        padding: 0 40px 20px 2px;
        font-size: 0.9rem;
        line-height: 1.8;
        color: var(--muted);
      }

      /* ---------- CTA 区块 ---------- */
      #app:not(.subject-mode) .cta-band {
        margin: clamp(56px, 7vw, 92px) 0 0;
        padding: clamp(40px, 6vw, 80px) clamp(22px, 4vw, 56px);
        text-align: center;
        background:
          radial-gradient(
            70% 120% at 50% 0%,
            rgba(56, 189, 248, 0.18),
            transparent 65%
          ),
          linear-gradient(
            180deg,
            color-mix(in srgb, var(--card) 90%, transparent),
            color-mix(in srgb, var(--card) 55%, transparent)
          );
        border: 1px solid var(--border);
        border-radius: 28px;
      }
      #app:not(.subject-mode) .cta-band h2 {
        margin: 0 0 12px;
        font-size: clamp(1.7rem, 2.8vw, 2.6rem);
        line-height: 1.2;
        letter-spacing: -0.02em;
        color: var(--text);
      }
      #app:not(.subject-mode) .cta-band p {
        max-width: 560px;
        margin: 0 auto;
        font-size: 0.95rem;
        line-height: 1.8;
        color: var(--muted);
      }
      #app:not(.subject-mode) .cta-band .home-cta {
        justify-content: center;
      }
      #app:not(.subject-mode) .card-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 22px;
      }
      #app:not(.subject-mode) #all {
        scroll-margin-top: 92px;
      }
      #app:not(.subject-mode) .explore-tools {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
        margin: 0 0 22px;
      }

        display: flex;
        flex: 1 1 260px;
        align-items: center;

        max-width: 420px;

          border-color 0.2s,
          box-shadow 0.2s;

      #app:not(.subject-mode) .explore-search:focus-within {

      #app:not(.subject-mode) .explore-search .s-ico {

        color: var(--muted);

        flex-wrap: wrap;
        gap: 8px;
      }

        display: inline-flex;

        gap: 6px;
        padding: 7px 14px;

        font-size: 0.84rem;

        background: transparent;
        border: 1px solid var(--border);

          border-color 0.2s,
          background 0.2s;

        opacity: 0.85;

      #app:not(.subject-mode) .card-grid.filtering .card {

      #app:not(.subject-mode) .no-result {
        margin: 18px 0 0;

      /* ---------- 企业式页脚 ---------- */

        gap: 32px;

      #app:not(.subject-mode) .sf-brand p {

        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
      }

      #app:not(.subject-mode) .sf-col button {

      #app:not(.subject-mode) .sf-col a:hover,
      #app:not(.subject-mode) .sf-col button:hover {
        color: var(--accent);

        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 8px 24px;
        margin-top: 36px;
        padding-top: 18px;
        font-size: 0.76rem;
        color: var(--muted);
        border-top: 1px solid var(--border);
      }
      @media (max-width: 1080px) {
        #app:not(.subject-mode) .bento {
          grid-template-columns: repeat(2, minmax(0, 1fr));

        #app:not(.subject-mode) .bento-card:nth-child(n) {
          grid-column: auto;
          grid-row: auto;
        }
        #app:not(.subject-mode) .bento .bento-main {
          grid-column: span 2;
        }
        #app:not(.subject-mode) .aud-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        #app:not(.subject-mode) .step {
          padding: 22px 20px 30px;
        }
        #app:not(.subject-mode) .step-ghost {
          font-size: 3.4rem;
          right: 10px;
        }
        #app:not(.subject-mode) .step-bar {
          right: 20px;
          left: 20px;
        }
        #app:not(.subject-mode) .card-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        #app:not(.subject-mode) .sf-top {
